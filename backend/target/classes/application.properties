# Application
spring.application.name=cybersecurity-soc
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/soc_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:soc_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:soc_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.soc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS
cors.allowed-origins=*

# Server
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.path=uploads/avatars

# Static resources
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# Frontend URL
app.frontend.url=http://localhost:4200

# Simulation Configuration (milliseconds)
simulation.incident.interval=45000
simulation.alert.interval=20000

# Enable Scheduling
spring.task.scheduling.pool.size=5

#spring.jackson.serialization.write-dates-with-zone-id=true
#spring.jackson.deserialization.adjust-dates-to-context-time-zone=false