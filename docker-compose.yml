services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: soc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: soc_db
      MYSQL_USER: soc_user
      MYSQL_PASSWORD: soc_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - soc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/soc_db
      SPRING_DATASOURCE_USERNAME: soc_user
      SPRING_DATASOURCE_PASSWORD: soc_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: mySecretKey123456789012345678901234567890
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soc-network

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - soc-network

  # Python AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: soc-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: soc_user
      DB_PASSWORD: soc_password
      DB_NAME: soc_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soc-network

volumes:
  mysql_data:

networks:
  soc-network:
    driver: bridge
